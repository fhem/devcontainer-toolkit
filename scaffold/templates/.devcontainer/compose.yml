# Managed by FHEM Devcontainer Toolkit.
name: __REPO_SLUG__-dev-env

services:
  fhem-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-}
        LOCAL_GID: ${LOCAL_GID:-}
        LOCAL_USER: ${LOCAL_USER:-dev}
    image: __REPO_SLUG__-dev-local:bookworm
    container_name: __REPO_SLUG__-dev
    init: true
    entrypoint: []
    working_dir: __WORKSPACE_DIR__
    command:
      - /bin/bash
      - -lc
      - bash __WORKSPACE_DIR__/.devcontainer/scripts/bootstrap-worktree.sh && exec /entry.sh start
    environment:
      TZ: Europe/Berlin
      HOME: /home/${LOCAL_USER:-dev}
      XDG_CONFIG_HOME: /opt/fhem-dev-data/home-config
      SVN_EDITOR: "code --wait"
      VISUAL: "code --wait"
      EDITOR: "code --wait"
      LOGFILE: /opt/fhem-dev-data/log/fhem-%Y-%m-%d.log
      RESTART: 0
      FHEM_UID: ${LOCAL_UID:-}
      FHEM_GID: ${LOCAL_GID:-}
      MODULE_REPO_ROOT: __WORKSPACE_DIR__
      MODULE_OVERLAY_ROOT: ${MODULE_OVERLAY_ROOT:-__WORKSPACE_DIR__}
      FHEM_TOOLKIT_ROOT: ${FHEM_TOOLKIT_ROOT:-/workspace/fhem-devcontainer-toolkit}
      FHEM_SOURCE_ROOT: ${FHEM_SOURCE_ROOT:-__WORKSPACE_DIR__/fhem}
      FHEM_TOOLKIT_FEATURES: ${FHEM_TOOLKIT_FEATURES:-}
    ports:
      - "${FHEM_WEB_PORT:-18083}:8083"
      - "${FHEM_TELNET_PORT:-17072}:7072"
    volumes:
      - ..:__WORKSPACE_DIR__
      - ../../fhem-devcontainer-toolkit:/workspace/fhem-devcontainer-toolkit
      - fhem_dev_worktree:/opt/fhem
      - fhem_dev_data:/opt/fhem-dev-data

volumes:
  fhem_dev_worktree:
  fhem_dev_data:
